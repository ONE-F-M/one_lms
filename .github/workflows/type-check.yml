name: Type Check

on:
  pull_request:
    branches: [staging, test-production, version-15]
    paths:
      - "one_lms/**/*.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typecheck-one_lms-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check with basedmypy
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install checker
        run: |
          pip install basedmypy~=2.0.0

      - name: Read typed files from pyproject.toml
        id: typed-files
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("pyproject.toml", "rb") as pyproject:
              config = tomllib.load(pyproject)

          files = config.get("tool", {}).get("mypy", {}).get("files", [])
          print(f"files={' '.join(files)}")
          PY

      - name: Run mypy on typed files only
        run: |
          mypy ${{ steps.typed-files.outputs.files }} --ignore-missing-imports
